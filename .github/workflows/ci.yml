name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Emit formatted Codex changes
        run: |
          npx biome format --write src/main/codex-app-server.ts src/main/codex-chat-state.ts src/main/main.ts src/renderer/App.tsx src/renderer/CodexPane.tsx src/renderer/codex-pane.css tests/codex-chat-state.cjs
          node -e 'const fs=require('fs'); for(const p of [\'src/main/codex-app-server.ts\',\'src/main/codex-chat-state.ts\',\'src/main/main.ts\',\'src/renderer/App.tsx\',\'src/renderer/CodexPane.tsx\',\'src/renderer/codex-pane.css\',\'tests/codex-chat-state.cjs\']) {const t=fs.readFileSync(p).toString('base64'); for(let i=0;i<t.length;i+=4000) console.log('CODEX_FORMATTED '+p+' '+(i/4000)+' '+t.slice(i,i+4000));}'
      - name: Lint and format check
        run: npm run check
      - name: Typecheck
        run: npm run typecheck
      - name: Regression tests
        run: npm test
      - name: Build
        run: npm run build
