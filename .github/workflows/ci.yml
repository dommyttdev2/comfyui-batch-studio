name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Lint and format check
        run: npm run check
      - name: Typecheck
        run: npm run typecheck
      - name: Regression tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Image memory regression and measurements
        run: |
          node tests/image-memory-benchmark.cjs
          xvfb-run -a node_modules/.bin/electron --no-sandbox tests/image-memory-electron.cjs

  windows-launcher-smoke:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Verify Windows launcher PowerShell command
        run: node tests/launcher-runtime-guard.cjs
