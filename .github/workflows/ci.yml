name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Emit formatted Codex status files
        run: |
          npx biome format --write src/main/codex-model-selection.ts src/main/codex-turn-monitor.ts src/main/main.ts src/renderer/CodexPane.tsx src/renderer/codex-pane.css tests/codex-turn-status.cjs
          node <<'NODE'
          const fs = require('fs');
          const files = ["src/main/codex-model-selection.ts","src/main/codex-turn-monitor.ts","src/main/main.ts","src/renderer/CodexPane.tsx","src/renderer/codex-pane.css","tests/codex-turn-status.cjs"];
          for (const p of files) {
            const data = fs.readFileSync(p).toString('base64');
            for (let i = 0; i < data.length; i += 4000) {
              console.log('CODEX_STATUS_FORMATTED ' + p + ' ' + (i / 4000) + ' ' + data.slice(i, i + 4000));
            }
          }
          NODE
      - name: Lint and format check
        run: npm run check
      - name: Typecheck
        run: npm run typecheck
      - name: Regression tests
        run: npm test
      - name: Build
        run: npm run build
