name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '**/*.md'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          node node_modules/electron/install.js
      - name: Lint and format check
        run: npm run check
      - name: Typecheck
        run: npm run typecheck
      - name: Regression tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Image memory regression and measurements
        run: |
          node tests/image-memory-benchmark.cjs
          xvfb-run -a node_modules/.bin/electron --no-sandbox tests/image-memory-electron.cjs
          BATCH_STUDIO_IMAGE_TEST_SIDE=3584 xvfb-run -a node_modules/.bin/electron --no-sandbox tests/image-memory-electron.cjs
